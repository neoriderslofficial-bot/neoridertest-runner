<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NeoRider Runner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 600px;
            background: #1f2833;
            border: 2px solid #66fcf1;
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.4);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #111318, #1f2833);
        }

        #ui-score {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #66fcf1;
            text-shadow: 2px 2px 4px #000;
        }

        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 12, 16, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            color: #ff4757;
            font-size: 36px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
        }

        p {
            font-size: 20px;
            margin-bottom: 20px;
            color: #c5c6c7;
        }

        button {
            padding: 14px 35px;
            font-size: 18px;
            font-weight: bold;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui-score">SCORE: 0</div>
        <canvas id="gameCanvas"></canvas>
        <div id="game-over-screen" class="hidden">
            <h1>GAME OVER</h1>
            <p id="final-score">Score: 0</p>
            <button onclick="resetGame()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('ui-score');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('final-score');

        canvas.width = 400;
        canvas.height = 600;

        const GROUND_Y = 480;

        let score = 0;
        let isGameOver = false;

        let player = {
            x: 50,
            y: GROUND_Y - 55,
            width: 40,
            height: 55,
            vy: 0,
            gravity: 0.65,
            jumpForce: -12,
            isJumping: false
        };

        let obstacles = [];

        window.addEventListener('touchstart', jumpAction);
        window.addEventListener('mousedown', jumpAction);
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                jumpAction();
            }
        });

        function jumpAction(e) {
            if (e && e.type === 'touchstart') e.preventDefault();
            if (!player.isJumping && !isGameOver) {
                player.vy = player.jumpForce;
                player.isJumping = true;
            }
        }

        function updateGame() {
            if (isGameOver) return;

            // Physics
            player.vy += player.gravity;
            player.y += player.vy;

            if (player.y >= GROUND_Y - player.height) {
                player.y = GROUND_Y - player.height;
                player.vy = 0;
                player.isJumping = false;
            }

            // Spawn Obstacles
            if (Math.random() < 0.02) {
                if (obstacles.length === 0 || obstacles[obstacles.length - 1].x < 240) {
                    obstacles.push({
                        x: canvas.width,
                        y: GROUND_Y - 45,
                        width: 30,
                        height: 45
                    });
                }
            }

            // Move Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= 5;

                // Collision
                if (
                    player.x < obstacles[i].x + obstacles[i].width &&
                    player.x + player.width > obstacles[i].x &&
                    player.y < obstacles[i].y + obstacles[i].height &&
                    player.y + player.height > obstacles[i].y
                ) {
                    triggerGameOver();
                }

                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                    score += 10;
                    scoreEl.innerText = `SCORE: ${score}`;
                }
            }

            renderGame();
            requestAnimationFrame(updateGame);
        }

        function renderGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Ground Area
            ctx.fillStyle = '#111318';
            ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

            // Neon Ground Border Line
            ctx.fillStyle = '#66fcf1';
            ctx.fillRect(0, GROUND_Y, canvas.width, 5);

            // Draw Player (Bright Yellow so it's clearly visible)
            ctx.fillStyle = '#ffd32a';
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Draw Obstacles (Bright Orange/Red)
            ctx.fillStyle = '#ff4757';
            obstacles.forEach(obs => {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            });
        }

        function triggerGameOver() {
            isGameOver = true;
            finalScoreEl.innerText = `Score: ${score}`;
            gameOverScreen.classList.remove('hidden');
        }

        function resetGame() {
            score = 0;
            isGameOver = false;
            player.y = GROUND_Y - player.height;
            player.vy = 0;
            player.isJumping = false;
            obstacles = [];
            scoreEl.innerText = `SCORE: 0`;
            gameOverScreen.classList.add('hidden');
            updateGame();
        }

        updateGame();
    </script>
</body>
</html>
