<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NeoRider Runner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            touch-action: manipulation;
        }

        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 400px;
            max-height: 700px;
        }

        canvas {
            background: linear-gradient(#1e90ff, #87ceeb);
            display: block;
            width: 100%;
            height: 100%;
        }

        #score {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px #000;
            z-index: 10;
        }

        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        .hidden {
            display: none !important;
        }

        button {
            margin-top: 15px;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="score">Score: 0</div>
        <canvas id="gameCanvas"></canvas>
        <div id="game-over" class="hidden">
            <h1>GAME OVER</h1>
            <p id="final-score" style="margin-top: 10px; font-size: 20px;">Score: 0</p>
            <button onclick="restartGame()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');

        // Fixed internal game resolution for consistent physics
        const GAME_WIDTH = 400;
        const GAME_HEIGHT = 600;
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;

        let groundY = GAME_HEIGHT - 120;
        let player = { x: 60, y: groundY - 50, width: 35, height: 50, vy: 0, jumping: false };
        let obstacles = [];
        let score = 0;
        let isGameOver = false;

        window.addEventListener('touchstart', jump);
        window.addEventListener('mousedown', jump);
        window.addEventListener('keydown', (e) => { 
            if (e.code === 'Space' || e.code === 'ArrowUp') jump(); 
        });

        function jump(e) {
            if (e && e.type === 'touchstart') e.preventDefault();
            if (!player.jumping && !isGameOver) {
                player.vy = -13;
                player.jumping = true;
            }
        }

        function update() {
            if (isGameOver) return;
            // Gravity & Physics
            player.vy += 0.65;
            player.y += player.vy;

            if (player.y >= groundY - player.height) {
                player.y = groundY - player.height;
                player.vy = 0;
                player.jumping = false;
            }

            // Spawn Obstacles
            if (Math.random() < 0.022) {
                if (obstacles.length === 0 || obstacles[obstacles.length - 1].x < GAME_WIDTH - 180) {
                    obstacles.push({ x: GAME_WIDTH, y: groundY - 45, width: 25, height: 45 });
                }
            }

            // Move Obstacles
            for (let i = 0; i < obstacles.length; i++) {
                obstacles[i].x -= 6;

                // Collision Detection
                if (
                    player.x < obstacles[i].x + obstacles[i].width &&
                    player.x + player.width > obstacles[i].x &&
                    player.y < obstacles[i].y + obstacles[i].height &&
                    player.y + player.height > obstacles[i].y
                ) {
                    endGame();
                }
            }

            // Remove offscreen obstacles & add score
            if (obstacles.length > 0 && obstacles[0].x < -40) {
                obstacles.shift();
                score += 10;
                scoreDisplay.innerText = Score: ${score};
            }

            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Ground Background
            ctx.fillStyle = '#2d3436';
            ctx.fillRect(0, groundY, canvas.width, GAME_HEIGHT - groundY);
            ctx.fillStyle = '#2ed573';
            ctx.fillRect(0, groundY, canvas.width, 12);

            // Player (Red Box)
            ctx.fillStyle = '#ff4757';
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Obstacles (Yellow Boxes)
            ctx.fillStyle = '#ffa502';
            obstacles.forEach(obs => {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            });
        }

        function endGame() {
            isGameOver = true;
            finalScoreDisplay.innerText = Score: ${score};
            gameOverScreen.classList.remove('hidden');
        }

        function restartGame() {
            player.y = groundY - player.height;
            player.vy = 0;
            player.jumping = false;
            obstacles = [];
            score = 0;
            isGameOver = false;
            scoreDisplay.innerText = Score: 0;
            gameOverScreen.classList.add('hidden');
            update();
        }

        update();
    </script>
</body>
</html>
